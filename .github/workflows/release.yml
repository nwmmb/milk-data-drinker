name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        run: |
          pip install -e ".[dev,download]"
          pytest tests/

      - name: Build wheel
        run: |
          pip install build
          rm -rf build dist *.egg-info
          python -m build --wheel

      - name: Validate downloader-only wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
          assert not any(name.startswith("milk_data_drinker/") for name in names)
          assert "timeless_downloader/source_format.py" in names
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
