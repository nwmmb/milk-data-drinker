[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timeless-downloader-utility"
dynamic = ["version"]
description = "Download Timeless MMBMS reports in reliable time-windowed batches"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "xlrd",
    "lxml",
]

[project.optional-dependencies]
download = ["requests", "tkcalendar>=1.6.1"]
dev = ["pytest"]

[project.scripts]
timeless-download = "timeless_downloader:main"
timeless-download-cli = "timeless_downloader.cli:main"
mdd-download = "timeless_downloader:deprecated_main"
mdd-download-cli = "timeless_downloader:deprecated_cli_main"

[tool.setuptools.dynamic]
version = {attr = "timeless_downloader._version.__version__"}

[tool.setuptools.packages.find]
include = ["timeless_downloader*"]
